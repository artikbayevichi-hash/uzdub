<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant 1 — Shisha (Glassmorphism)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(1200px 700px at 15% 10%, #4c1d95 0%, transparent 55%),radial-gradient(1000px 600px at 85% 20%, #155e75 0%, transparent 55%),radial-gradient(900px 700px at 60% 100%, #0f172a 0%, transparent 60%),#0b1020;}
  .label{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#c7d5f2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);padding:8px 18px;border-radius:30px;font-size:13px;letter-spacing:.3px;z-index:9;}
  .panel{width:382px;height:560px;background:rgba(20,28,50,.42);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.16);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .panel::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.09) 0%,transparent 40%);pointer-events:none;}

  .hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(129,140,248,.55);}
  .ava svg{width:20px;height:20px;fill:#fff;}
  .hinfo{flex:1;min-width:0;}
  .hinfo b{color:#f1f5ff;font-size:14px;display:block;}
  .onl{color:#34d399;font-size:11px;display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;display:inline-block;animation:p 2s infinite;}
  @keyframes p{50%{transform:scale(1.4);opacity:.6}}
  .ib{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#b9c6e5;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .ib:hover{background:rgba(255,255,255,.12);color:#fff;transform:scale(1.07);}

  .orbarea{display:flex;align-items:center;justify-content:center;padding:20px 0 8px;flex-shrink:0;}
  .wrap{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;}
  .orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #e0e7ff 0%, #818cf8 35%, #4f46e5 65%, #1e1b4b 100%);box-shadow:0 0 34px rgba(129,140,248,.6),inset 0 0 24px rgba(255,255,255,.25);animation:br 4s ease-in-out infinite;position:relative;z-index:2;}
  @keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(129,140,248,.4);opacity:0;}

  .st{text-align:center;font-size:12.5px;color:#aebade;min-height:16px;flex-shrink:0;}
  .inter{min-height:42px;padding:4px 22px 2px;font-size:14px;text-align:center;color:#e6edff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .inter:empty::before{content:"Gapiring...";color:#7c8cb5;font-size:12.5px;}

  .log{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .b{border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.5;max-width:88%;}
  .b.bot{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);color:#e8eeff;border-bottom-left-radius:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .chips span{font-size:11.5px;padding:6px 12px;border-radius:20px;background:rgba(129,140,248,.18);border:1px solid rgba(129,140,248,.35);color:#d9e0ff;cursor:pointer;transition:.2s;}
  .chips span:hover{background:rgba(129,140,248,.32);transform:scale(1.04);}

  .set{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:4px 12px 2px;font-size:11px;color:#aebade;flex-shrink:0;}
  .set select{background:rgba(255,255,255,.08);color:#e6edff;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px 8px;font-size:11px;outline:none;}
  .set label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .set label input{accent-color:#818cf8;}

  .inbar{display:flex;gap:8px;align-items:center;padding:8px 12px 6px;flex-shrink:0;}
  .inbar input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:10px 14px;color:#f1f5ff;font-size:13px;outline:none;}
  .inbar input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.2);}
  .vb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#c7d5f2;cursor:pointer;font-size:17px;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .vb:active{transform:scale(.92);}
  .vb.snd{background:linear-gradient(135deg,#6366f1,#22d3ee);border:none;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.5);}
  .vb.mic{background:linear-gradient(135deg,#f43f5e,#fb7185);border:none;color:#fff;width:52px;height:52px;font-size:20px;box-shadow:0 4px 18px rgba(244,63,94,.5);}
  .foot{text-align:center;padding:0 12px 12px;font-size:10.5px;color:#7c8cb5;flex-shrink:0;}
</style>
</head>
<body>
<div class="label">💠 <b>Variant 1</b> — Shisha (Glassmorphism)</div>
<div class="panel">
  <div class="hdr">
    <div class="ava"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 3.6 19.33L22 22l-1.03-4.24A10 10 0 0 0 12 2z"/></svg></div>
    <div class="hinfo"><b>UZDUB AI</b><span class="onl"><i class="dot"></i> Online</span></div>
    <button class="ib">📋</button>
    <button class="ib">＋</button>
    <button class="ib">✕</button>
  </div>
  <div class="orbarea">
    <div class="wrap"><span class="ring"></span><span class="ring"></span><span class="ring"></span><div class="orb"></div></div>
  </div>
  <div class="st">Tayyor 😊</div>
  <div class="inter"></div>
  <div class="log">
    <div class="b bot">Assalomu alaykum! Men UZDUB AI yordamchisiman. 🎤 tugmasini bosing va gapiring.</div>
    <div class="chips"><span>🔥 Eng ko'p ko'rilganlar</span><span>😂 Kulgili film</span><span>👻 Qo'rqinchli anime</span><span>🧙 Sehrli / fantastik</span></div>
  </div>
  <div class="set">
    <select>🎤 O'zbekcha</select>
    <select>🗣 Madina</select>
    <label><input type="checkbox" checked> Jonli rejim</label>
  </div>
  <div class="inbar">
    <button class="vb">🔊</button>
    <input placeholder="Matn yozing yoki gapiring...">
    <button class="vb snd">➤</button>
    <button class="vb mic">🎤</button>
  </div>
  <div class="foot">🎤 tugmasini bosing — erkin gapiring.</div>
</div>
</body>
</html>
