<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant 4 — Yumshoq (Light)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(150deg,#dbeafe 0%,#e0e7ff 45%,#fae8ff 100%);}
  .label{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#1e3a8a;background:rgba(255,255,255,.75);border:1px solid rgba(37,99,235,.25);box-shadow:0 6px 18px rgba(37,99,235,.12);padding:8px 18px;border-radius:30px;font-size:13px;letter-spacing:.3px;z-index:9;}
  .panel{width:382px;height:560px;background:#ffffff;border:1px solid #e5e9f2;border-radius:24px;box-shadow:0 24px 60px rgba(30,64,175,.14),0 4px 14px rgba(30,64,175,.06);overflow:hidden;display:flex;flex-direction:column;position:relative;}

  .hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eef1f8;flex-shrink:0;}
  .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(59,130,246,.35);}
  .ava svg{width:20px;height:20px;fill:#fff;}
  .hinfo{flex:1;min-width:0;}
  .hinfo b{color:#1e293b;font-size:14px;display:block;}
  .onl{color:#059669;font-size:11px;display:flex;align-items:center;gap:5px;font-weight:600;}
  .dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6);display:inline-block;animation:p 2s infinite;}
  @keyframes p{50%{transform:scale(1.4);opacity:.6}}
  .ib{width:32px;height:32px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .ib:hover{background:#eef2ff;color:#4f46e5;transform:scale(1.07);}

  .orbarea{display:flex;align-items:center;justify-content:center;padding:20px 0 8px;flex-shrink:0;}
  .wrap{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;}
  .orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #ffffff 0%, #93c5fd 35%, #3b82f6 65%, #1e3a8a 100%);box-shadow:0 10px 26px rgba(59,130,246,.4),inset 0 0 22px rgba(255,255,255,.5);animation:br 4s ease-in-out infinite;position:relative;z-index:2;}
  @keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(59,130,246,.3);opacity:0;}

  .st{text-align:center;font-size:12.5px;color:#64748b;min-height:16px;flex-shrink:0;}
  .inter{min-height:42px;padding:4px 22px 2px;font-size:14px;text-align:center;color:#334155;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .inter:empty::before{content:"Gapiring...";color:#94a3b8;font-size:12.5px;}

  .log{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  .b{border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.5;max-width:88%;}
  .b.bot{background:#f1f5f9;border:1px solid #e2e8f0;color:#334155;border-bottom-left-radius:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .chips span{font-size:11.5px;padding:6px 12px;border-radius:20px;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;cursor:pointer;transition:.2s;}
  .chips span:hover{background:#e0e7ff;transform:scale(1.04);}

  .set{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:4px 12px 2px;font-size:11px;color:#64748b;flex-shrink:0;}
  .set select{background:#f8fafc;color:#334155;border:1px solid #e2e8f0;border-radius:20px;padding:3px 8px;font-size:11px;outline:none;}
  .set select:focus{border-color:#3b82f6;}
  .set label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .set label input{accent-color:#3b82f6;}

  .inbar{display:flex;gap:8px;align-items:center;padding:8px 12px 6px;flex-shrink:0;}
  .inbar input{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:24px;padding:10px 14px;color:#1e293b;font-size:13px;outline:none;}
  .inbar input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15);}
  .vb{width:46px;height:46px;border-radius:50%;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;cursor:pointer;font-size:17px;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .vb:active{transform:scale(.92);}
  .vb.snd{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.35);}
  .vb.mic{background:linear-gradient(135deg,#f43f5e,#fb7185);border:none;color:#fff;width:52px;height:52px;font-size:20px;box-shadow:0 6px 18px rgba(244,63,94,.4);}
  .foot{text-align:center;padding:0 12px 12px;font-size:10.5px;color:#94a3b8;flex-shrink:0;}
</style>
</head>
<body>
<div class="label">☀️ <b>Variant 4</b> — Yumshoq (Light)</div>
<div class="panel">
  <div class="hdr">
    <div class="ava"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 3.6 19.33L22 22l-1.03-4.24A10 10 0 0 0 12 2z"/></svg></div>
    <div class="hinfo"><b>UZDUB AI</b><span class="onl"><i class="dot"></i> Online</span></div>
    <button class="ib">📋</button>
    <button class="ib">＋</button>
    <button class="ib">✕</button>
  </div>
  <div class="orbarea">
    <div class="wrap"><span class="ring"></span><span class="ring"></span><span class="ring"></span><div class="orb"></div></div>
  </div>
  <div class="st">Tayyor 😊</div>
  <div class="inter"></div>
  <div class="log">
    <div class="b bot">Assalomu alaykum! Men UZDUB AI yordamchisiman. 🎤 tugmasini bosing va gapiring.</div>
    <div class="chips"><span>🔥 Eng ko'p ko'rilganlar</span><span>😂 Kulgili film</span><span>👻 Qo'rqinchli anime</span><span>🧙 Sehrli / fantastik</span></div>
  </div>
  <div class="set">
    <select>🎤 O'zbekcha</select>
    <select>🗣 Madina</select>
    <label><input type="checkbox" checked> Jonli rejim</label>
  </div>
  <div class="inbar">
    <button class="vb">🔊</button>
    <input placeholder="Matn yozing yoki gapiring...">
    <button class="vb snd">➤</button>
    <button class="vb mic">🎤</button>
  </div>
  <div class="foot">🎤 tugmasini bosing — erkin gapiring.</div>
</div>
</body>
</html>
